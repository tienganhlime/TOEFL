<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIME ✿ Kho bài thi thử</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ffd6e8; --pink2:#ffb3d1; --hot:#ff7eb6; --cream:#fff8fb;
    --mint:#c9f2e3; --lemon:#fff3b8; --sky:#cfe8ff; --lilac:#e4d4ff; --peach:#ffd9c4;
    --ink:#6b3b57;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Quicksand',sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 10% 10%, #ffe3f0 0 12%, transparent 13%),
      radial-gradient(circle at 90% 20%, #fff0c9 0 9%, transparent 10%),
      radial-gradient(circle at 80% 90%, #e4d4ff 0 12%, transparent 13%),
      radial-gradient(circle at 5% 85%, #c9f2e3 0 10%, transparent 11%),
      var(--cream);
    background-attachment:fixed; min-height:100vh;
  }
  .wrap{max-width:1000px; margin:0 auto; padding:32px 18px 60px}
  header{text-align:center; margin-bottom:26px; position:relative}
  .logo{
    display:inline-block; font-family:'Baloo 2'; font-weight:800; font-size:clamp(2rem,6vw,3.2rem);
    color:#fff; background:var(--hot); padding:6px 28px; border-radius:60px;
    box-shadow:0 6px 0 #e85d9a, 0 14px 24px rgba(255,126,182,.35);
    transform:rotate(-2deg);
  }
  .sub{font-weight:700; margin-top:18px; font-size:1.1rem}
  .float{position:absolute; font-size:2rem; animation:bob 3s ease-in-out infinite}
  .f1{left:6%; top:0} .f2{right:7%; top:10px; animation-delay:.6s}
  .f3{left:16%; top:70px; animation-delay:1.2s; font-size:1.5rem} .f4{right:17%; top:78px; animation-delay:1.8s; font-size:1.5rem}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}

  .tools{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:26px}
  .search{
    flex:1 1 280px; max-width:420px; padding:12px 20px; border-radius:40px; border:3px solid var(--pink2);
    font:600 1rem 'Quicksand'; color:var(--ink); background:#fff; outline:none;
  }
  .search:focus{border-color:var(--hot); box-shadow:0 0 0 5px rgba(255,126,182,.2)}
  .chip{
    border:3px solid var(--pink2); background:#fff; color:var(--ink); padding:10px 16px; border-radius:40px;
    font:700 .95rem 'Quicksand'; cursor:pointer; transition:.15s;
  }
  .chip:hover{transform:translateY(-2px)}
  .chip.on{background:var(--hot); border-color:var(--hot); color:#fff}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:20px}
  .card{
    display:block; text-decoration:none; color:var(--ink); border-radius:28px; padding:20px 20px 16px;
    border:3px solid #fff; box-shadow:0 8px 0 rgba(107,59,87,.08), 0 14px 26px rgba(255,126,182,.18);
    transition:.2s; position:relative; overflow:hidden;
  }
  .card:hover{transform:translateY(-6px) rotate(-1deg); box-shadow:0 12px 0 rgba(107,59,87,.1), 0 20px 30px rgba(255,126,182,.3)}
  .card:nth-child(5n+1){background:var(--pink)}
  .card:nth-child(5n+2){background:var(--mint)}
  .card:nth-child(5n+3){background:var(--lemon)}
  .card:nth-child(5n+4){background:var(--sky)}
  .card:nth-child(5n+5){background:var(--lilac)}
  .emoji{font-size:2.4rem; display:block; margin-bottom:6px}
  .title{font-family:'Baloo 2'; font-weight:700; font-size:1.25rem; line-height:1.2; margin:0 0 8px}
  .tag{display:inline-block; background:rgba(255,255,255,.75); border-radius:20px; padding:3px 12px; font-size:.8rem; font-weight:700}
  .go{
    position:absolute; right:14px; bottom:12px; width:36px; height:36px; border-radius:50%;
    background:#fff; display:grid; place-items:center; font-weight:800; color:var(--hot); transition:.2s;
  }
  .card:hover .go{background:var(--hot); color:#fff; transform:scale(1.15)}
  .copy{
    position:absolute; right:56px; bottom:12px; height:36px; padding:0 12px; border-radius:20px; border:none;
    background:rgba(255,255,255,.8); font:700 .8rem 'Quicksand'; color:var(--ink); cursor:pointer;
  }
  .copy:hover{background:#fff}

  .msg{text-align:center; font-weight:700; padding:40px 10px; font-size:1.1rem}
  footer{text-align:center; margin-top:46px; font-weight:700; opacity:.7}
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,100px); background:var(--hot); color:#fff;
    padding:12px 24px; border-radius:40px; font-weight:700; transition:.3s; z-index:9;
  }
  .toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="float f1">🌸</span><span class="float f2">⭐</span>
    <span class="float f3">🍓</span><span class="float f4">🎀</span>
    <div class="logo">LIME ✿ Trial Tests</div>
    <div class="sub">Chọn bài và bắt đầu thôi nào~ 🍬</div>
  </header>

  <div class="tools">
    <input class="search" id="q" placeholder="🔍 Tìm bài thi thử...">
    <div id="chips" style="display:contents"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">Đang tải bài cho bạn... 🐣</div>

  <footer>Made with 💗 for LIME</footer>
</div>
<div class="toast" id="toast">Đã copy link! ✨</div>

<script>
// ====== CẤU HÌNH ======
const OWNER = "tienganhlime";
const REPO  = "TOEFL";
const BRANCH = "main";
const SITE = `https://${OWNER}.github.io/${REPO}/`;
const HIDE = ["index.html"];   // file không hiện trong danh sách
// ======================

const ICONS = [
  [/listening/i,"🎧"], [/reading/i,"📖"], [/writing/i,"✏️"], [/speaking/i,"🎤"],
  [/vocab/i,"🍓"], [/grammar/i,"🧁"], [/ielts/i,"🌍"], [/fce/i,"🎓"]
];
const TAGS = [
  [/primary/i,"Primary"], [/junior/i,"Junior"], [/toefl/i,"TOEFL"],
  [/ielts/i,"IELTS"], [/fce/i,"FCE"]
];

const pretty = f => f.replace(/\.html?$/i,"").replace(/[-_]+/g," ")
  .replace(/\b\w/g,c=>c.toUpperCase());
const pick = (arr,s,def) => (arr.find(([r])=>r.test(s))||[0,def])[1];

let items = [], activeTag = "Tất cả";

async function load(){
  try{
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`);
    if(!r.ok) throw new Error(r.status);
    const files = await r.json();
    items = files
      .filter(f => f.type==="file" && /\.html?$/i.test(f.name) && !HIDE.includes(f.name))
      .map(f => ({title:pretty(f.name), url:SITE+f.name, name:f.name}));
  }catch(e){
    document.getElementById("msg").textContent = "Ôi, không tải được danh sách 🥺 Thử tải lại trang nhé!";
    return;
  }
  // Link ngoài (tùy chọn): tạo file links.json dạng [{"title":"...","url":"...","tag":"..."}]
  try{
    const r = await fetch("links.json?"+Date.now());
    if(r.ok){ (await r.json()).forEach(l=>items.push({title:l.title,url:l.url,name:l.title,tag:l.tag})); }
  }catch(e){}

  items.forEach(i=>{
    i.icon = pick(ICONS,i.name,"🌈");
    i.tag  = i.tag || pick(TAGS,i.name,"Khác");
  });
  items.sort((a,b)=>a.title.localeCompare(b.title));
  document.getElementById("msg").style.display = items.length ? "none":"block";
  if(!items.length) document.getElementById("msg").textContent = "Chưa có bài nào, upload file lên nhé 🌱";
  buildChips(); render();
}

function buildChips(){
  const tags = ["Tất cả", ...new Set(items.map(i=>i.tag))];
  const box = document.getElementById("chips");
  box.innerHTML = "";
  tags.forEach(t=>{
    const b = document.createElement("button");
    b.className = "chip"+(t===activeTag?" on":"");
    b.textContent = t;
    b.onclick = ()=>{activeTag=t; buildChips(); render();};
    box.appendChild(b);
  });
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  items.filter(i => (activeTag==="Tất cả"||i.tag===activeTag) && i.title.toLowerCase().includes(q))
    .forEach(i=>{
      const a = document.createElement("a");
      a.className="card"; a.href=i.url; a.target="_blank"; a.rel="noopener";
      a.innerHTML = `<span class="emoji">${i.icon}</span>
        <h3 class="title">${i.title}</h3><span class="tag">${i.tag}</span>`;
      const cp = document.createElement("button");
      cp.className="copy"; cp.textContent="📋 Copy";
      cp.onclick = e=>{
        e.preventDefault(); e.stopPropagation();
        navigator.clipboard.writeText(i.url).then(()=>{
          const t=document.getElementById("toast"); t.classList.add("show");
          setTimeout(()=>t.classList.remove("show"),1500);
        });
      };
      const go = document.createElement("span"); go.className="go"; go.textContent="➜";
      a.append(cp,go); grid.appendChild(a);
    });
}
document.getElementById("q").addEventListener("input",render);
load();
</script>
</body>
</html>
